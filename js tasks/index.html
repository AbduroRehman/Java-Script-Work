<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align: center;">Tech Store</h2>
    <div id="product-list" class="product-grid"></div>

    <div style="padding: 20px; font-family: sans-serif;">
    <h3>Location Selector</h3>
    
    <label for="country">Country:</label>
    <select id="country" style="padding: 5px; width: 150px;">
        <option value="">Select Country</option>
    </select>

    <label for="city" style="margin-left: 20px;">City:</label>
    <select id="city" style="padding: 5px; width: 150px;">
        <option value="">Select City</option>
    </select>
</div>

    <script src="script.js"></script>
</body>
</html>
